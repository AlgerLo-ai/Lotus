<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#d9b25f;--bg:#000;--fg:#fff}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;display:flex;justify-content:center}

.stage img{width:100%;display:block}
.tap{position:absolute;left:50%;top:70%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.float{position:absolute;left:50%;top:62%;color:var(--gold);font-weight:900;font-size:18px;pointer-events:none;animation:up 1.2s forwards}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.count{margin:-6px 0 14px;font-size:13px;color:var(--gold);letter-spacing:.15em}
.btns{display:flex;gap:14px}
.btns button{flex:1;padding:18px 0;border-radius:40px;border:1px solid #222;background:#141414;color:#fff;font:700 20px "Noto Serif TC",serif;letter-spacing:.3em}
